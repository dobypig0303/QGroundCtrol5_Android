# Patched gradle.properties for the QGroundControl 4.0.11 / Qt 5.12.6 Android build.
#
# NOTE: paths here MUST use forward slashes. The Java properties parser treats a
# backslash as an escape character, so androiddeployqt's own
# "qt5AndroidDir=C:\Qt5\5.12.6\..." silently became "C:Qt55.12.6\..." and Gradle
# failed with:
#     Cannot convert URL 'C:Qt55.12.6android_armv7/src/android/java/src' to a file.

# Installed on this machine (SDK has platforms 33/34/35, build-tools 33.0.1/34.0.0/35.0.0)
androidBuildToolsVersion=35.0.0
androidCompileSdkVersion=35

buildDir=build
qt5AndroidDir=C:/Qt5/5.12.6/android_armv7/src/android/java

# Allow AndroidX usage
android.useAndroidX=true

# Keep R fields final so Qt 5.12's Java (which predates this AGP default) compiles
android.nonFinalResIds=false

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
